<!doctype html>
<html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#c9efff" /><title>MY WORLD</title><link rel="manifest" href="manifest.webmanifest" /><link rel="stylesheet" href="style.css" /><link rel="stylesheet" href="figma-footer.css" /><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.179.1/build/three.module.js","three/addons/":"https://unpkg.com/three@0.179.1/examples/jsm/"}}</script></head>
<body><main class="app"><section class="map-view"><header class="topbar"><div class="title"><h1>MY WORLD</h1><p>SEP 08 <span>•</span> 1.2 km</p></div><button id="compass" class="compass" aria-label="地図の向きを戻す" style="width:64px;height:64px;padding:0;border:0;background:transparent"><img src="compass.svg" alt="方位" style="display:block;width:100%;height:100%;transform-origin:center" /></button></header>
<div id="map-stage" class="map-stage"><div id="world-canvas" aria-label="回転できるボクセルの世界"></div><div class="mist mist-a"></div><div class="mist mist-b"></div><p class="map-hint">指で世界を回す</p></div>
<button id="replay" class="day-card" aria-label="今日の冒険を生成"><img src="figma-assets/generate.svg" alt="" /><span id="status">今日の冒険を生成</span></button>
<nav class="nav"><button class="nav-item active" data-panel="map"><img src="figma-assets/map.svg" alt="" /><b>MAP</b></button><button class="nav-item" data-panel="memories"><img src="figma-assets/memories.svg" alt="" /><b>MEMORIES</b></button><button class="nav-item" data-panel="history"><img src="figma-assets/history.svg" alt="" /><b>HISTORY</b></button></nav></section>
<section id="memories" class="panel" aria-hidden="true"><button class="close">×</button><div class="grab"></div><p class="eyebrow">MEMORY</p><h2>今日をひとつ残す</h2><label class="photo"><input id="photo" type="file" accept="image/*" capture="environment" /><span>＋ 写真を撮る／選ぶ</span></label><textarea id="note" placeholder="一言だけでも残しておこう"></textarea><button id="save" class="primary">この場所を記憶する</button></section>
<section id="history" class="panel" aria-hidden="true"><button class="close">×</button><div class="grab"></div><p class="eyebrow">MY HISTORY</p><h2>歩いた日の記録</h2><div id="history-list"></div></section></main><script type="module" src="app.js"></script></body></html>
